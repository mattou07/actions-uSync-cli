name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  # Runs the action against a real test site. Only runs when the repository
  # variable USYNC_TEST_SERVER is set (with secrets USYNC_TEST_CLIENT_ID and
  # USYNC_TEST_CLIENT_SECRET for an API user on that site).
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    if: ${{ vars.USYNC_TEST_SERVER != '' }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Report only against the test site
        id: test-action
        uses: ./
        with:
          server: ${{ vars.USYNC_TEST_SERVER }}
          client-id: ${{ secrets.USYNC_TEST_CLIENT_ID }}
          client-secret: ${{ secrets.USYNC_TEST_CLIENT_SECRET }}
          import: false

      - name: Print Output
        id: output
        run: |
          echo "Stages: ${{ steps.test-action.outputs.stages }}"
          echo "Pending changes: ${{ steps.test-action.outputs.pending-changes }}"
