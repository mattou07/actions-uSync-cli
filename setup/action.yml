name: 'uSync CLI Setup'
description: 'Install and setup uSync CLI for Umbraco synchronization'
author: 'mattou07'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'download'
  color: 'blue'

# Define your inputs here.
inputs:
  dotnet-version:
    description:
      'Optional .NET SDK version to ensure compatibility (e.g., 8.0.x, 6.0.x)'
    required: false
    default: '8.0.x'

  usync-version:
    description:
      'Specific version of uSync CLI to install (e.g., 11.1.0) or "latest"'
    required: false
    default: 'latest'

  force-reinstall:
    description: 'Force reinstall even if uSync CLI is already present'
    required: false
    default: 'false'

# Define your outputs here.
outputs:
  success:
    description: 'Whether the setup was successful'

  dotnet-version:
    description: 'Version of .NET detected on the runner'

  usync-version:
    description: 'Version of uSync CLI installed'

  install-location:
    description: 'Location where uSync CLI was installed'

  version:
    description: 'Version of uSync CLI installed (backward compatibility)'

runs:
  using: node20
  main: ../dist/setup/index.js
