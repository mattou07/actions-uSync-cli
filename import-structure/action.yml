name: 'uSync Import Structure'
description:
  'Import document types and data types with built-in reporting and validation'
author: 'mattou07'

branding:
  icon: 'database'
  color: 'green'

inputs:
  server:
    description: 'Umbraco server URL'
    required: true

  key:
    description: 'HMAC key for authentication'
    required: true

  set:
    description: 'Handler set to use'
    required: false
    default: 'default'

  force:
    description: 'Force import (overwrite existing structure)'
    required: false
    default: 'false'

  report-first:
    description: 'Run a report first to show what will change'
    required: false
    default: 'true'

outputs:
  report-result:
    description: 'Result of the report operation (if run)'

  import-result:
    description: 'Result of the import operation'

  changes-detected:
    description: 'Number of structure changes detected'

  changes-imported:
    description: 'Number of structure items imported'

  success:
    description: 'Whether the import operation was successful'

runs:
  using: 'node20'
  main: '../dist/import-structure/index.js'
